  its docs template repo (palmetto-example-ts-energy-and-finance) instead shows
  how to GENERATE typed Energy and Finance API clients from the OpenAPI specs.
  The registry-published first-party libraries below are Palmetto's front-end
  design system (React components + design tokens), not API client SDKs, so no
  `SDKs` pointer is emitted.
