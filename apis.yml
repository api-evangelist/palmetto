name: Palmetto
description: >-
  Palmetto is a clean-energy technology company that helps homeowners and
  partners adopt solar, HVAC, battery storage, water heaters and financing. For
  developers and technology partners it publishes three API products under
  docs.palmetto.com: the Energy Intelligence API (physics-based building energy
  modeling and solar simulation for any US home, down to hourly granularity and
  disaggregated to end use), the Energy Platform API (submit customers, designs
  and pricing into Palmetto's fulfillment pipeline), and the Finance (LightReach)
  API for financing clean-energy projects, complete with webhooks. Backed by
  Social Capital.
